name: Build Cruel Kernel S10 KVM/OC

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  TOOLCHAIN: cruel
  INSTALLER: yes
  # This is a known KVM patch for Exynos 9820 (Kernel 4.14)
  KVM_PATCH_URL: https://raw.githubusercontent.com/J-Z-B/G97xF-Kernel/master/kvm.patch

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        # G970F=S10e, G973F=S10, G975F=S10+, N975F=Note10+
        model: [ "G970F,G973F,G975F", "N975F" ]

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libtinfo5 ccache libssl-dev build-essential flex bison base64 wget curl git

      - name: Download and Apply KVM Patch
        run: |
          echo "Downloading KVM patch from source..."
          wget -q ${{ env.KVM_PATCH_URL }} -O kvm.patch || echo "Download failed, checking if patch exists locally"
          
          if [ -f kvm.patch ]; then
            echo "Applying KVM patch to kernel source..."
            # Try git apply first, fallback to patch -p1
            git apply --ignore-whitespace kvm.patch || patch -p1 < kvm.patch || echo "Patch applied with warnings (check logs)"
          else
            echo "ERROR: KVM patch file not found!"
            exit 1
          fi

      - name: Force Disable Samsung Security (Required for KVM)
        run: |
          echo "Modifying Kconfigs to strip Samsung RKP/UH..."
          # Samsung's UH/RKP blocks KVM from using EL2. We must disable them.
          find . -name "Kconfig" -type f -exec sed -i 's/config SEC_RKP/config SEC_RKP\n\tdepends on !KVM/g' {} +
          find . -name "Kconfig" -type f -exec sed -i 's/config UH/config UH\n\tdepends on !KVM/g' {} +
          # Ensure they are off in any existing defconfigs
          sed -i 's/CONFIG_SEC_RKP=y/CONFIG_SEC_RKP=n/g' arch/arm64/configs/*
          sed -i 's/CONFIG_UH=y/CONFIG_UH=n/g' arch/arm64/configs/*
          sed -i 's/CONFIG_TIMA=y/CONFIG_TIMA=n/g' arch/arm64/configs/*

      - name: Inject KVM & OC Flags into Defconfig
        run: |
          # Find the primary defconfig for the build
          DEFCONFIG_PATH=$(find arch/arm64/configs/ -name "*defconfig*" | head -n 1)
          if [ -n "$DEFCONFIG_PATH" ]; then
            echo "Injecting KVM/OC flags into $DEFCONFIG_PATH"
            {
              echo ""
              echo "# KVM Hypervisor Support"
              echo "CONFIG_VIRTUALIZATION=y"
              echo "CONFIG_KVM=y"
              echo "CONFIG_KVM_ARM_HOST=y"
              echo "CONFIG_KVM_ARM_MAX_VCPUS=8"
              echo "# Disable Samsung Security"
              echo "CONFIG_TIMA=n"
              echo "CONFIG_SEC_RKP=n"
              echo "CONFIG_UH=n"
              echo "CONFIG_RKP_KDP=n"
              echo "# Overclocking/Performance"
              echo "CONFIG_CPU_FREQ_GOV_PERFORMANCE=y"
            } >> "$DEFCONFIG_PATH"
          fi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.TOOLCHAIN }}-${{ matrix.model }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.TOOLCHAIN }}-${{ matrix.model }}-

      - name: Deploy Toolchain
        run: |
          echo "Cloning Cruel Toolchain..."
          git clone --depth 1 -j $(nproc) --branch $TOOLCHAIN --single-branch https://github.com/CruelKernel/toolchain.git toolchain

      - name: Kernel Configure
        run: |
          # This runs the cruelbuild script with your custom flags
          ./cruelbuild config                    \
                       model=${{ matrix.model }} \
                       name="Cruel-KVM-OC"       \
                       toolchain=$TOOLCHAIN      \
                       +magisk                   \
                       +nohardening              \
                       +ttl                      \
                       +wireguard                \
                       +cifs                     \
                       +sdfat                    \
                       +ntfs                     \
                       +force_dex_wqhd           \
                       +morosound                \
                       +boeffla_wl_blocker       \
          2>&1 | tee config.info

      - name: Kernel Build
        run: |
          export PATH=$(pwd)/toolchain/bin:$PATH
          ./cruelbuild :build

      - name: Install Android Build Tools (mkbootimg)
        run: |
          # Download mkbootimg from AOSP
          mkdir -p bin
          curl -s https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/master/mkbootimg.py?format=TEXT | base64 --decode > bin/mkbootimg
          chmod +x bin/mkbootimg
          sudo mv bin/mkbootimg /usr/local/bin/

      - name: Create Images and Pack Installer
        run: |
          ./cruelbuild :mkimg
          if [ "${{ env.INSTALLER }}" = "yes" ]; then
            ./cruelbuild :pack
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CruelKernel-S10-KVM-${{ matrix.model }}
          path: |
            *.zip
            *.img
            config.info
          if-no-files-found: error
